[project]
name = "rmi-mcp-x402"
version = "5.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.28",
    "pydantic>=2.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build-api"
