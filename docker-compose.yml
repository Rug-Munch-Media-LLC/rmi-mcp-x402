# Coffer — self-hosted x402 payment facilitator. One-command deploy.
#   cp .env.example .env      # fill X402_WALLET (+ REDIS_URL auto-provided)
#   docker compose up --build -d
# Exposes the /v1/x402 HTTP surface on http://localhost:8001.
services:
  coffer:
    build:
      context: .
      dockerfile: Dockerfile
    image: coffer:latest
    container_name: coffer
    restart: unless-stopped
    env_file:
      - /srv/rmi-infra/.env.coffer
    environment:
      # Compose wires the managed redis into Coffer for nonce/replay.
      REDIS_URL: redis://redis:6379/0
    ports:
      # Hardened: bind the host port to loopback only. Pry reaches coffer over
      # the shared `rmi` network (container-to-container via coffer:8001), not
      # through a publicly-exposed host port.
      - "127.0.0.1:${X402_PORT:-8001}:8001"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8001/v1/x402/health',timeout=3)\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - coffer-net
      - rmi
    # Minimal hardening: read-only rootfs (writes only to /dev/shm TMPFS).
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cpus: "1.0"
    mem_limit: 1g
    pids_limit: 512

  redis:
    image: redis:7-alpine
    container_name: coffer-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - coffer-net
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cpus: "0.50"
    mem_limit: 256m
    pids_limit: 512

networks:
  coffer-net:
    driver: bridge
  # Join the shared rmi network so the Pry stack (and other rmi services on
  # rmi_network) can reach coffer by container/service name (e.g. coffer:8001).
  rmi:
    external: true
    name: rmi_network

volumes:
  redis-data:
